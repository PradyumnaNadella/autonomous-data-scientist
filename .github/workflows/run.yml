# "Run agent" button: runs any system on a task on GitHub's machine and commits results.
name: Run agent

on:
  workflow_dispatch:
    inputs:
      system:
        description: System to run
        type: choice
        options: [single_agent, pipeline, direct, automl]
        default: single_agent
      task:
        description: Existing task name (leave empty to add a new CSV dataset)
        type: string
        default: ""
      name:
        description: "New dataset: task name"
        type: string
        default: ""
      url:
        description: "New dataset: CSV URL"
        type: string
        default: ""
      target:
        description: "New dataset: column to predict"
        type: string
        default: ""
      task_type:
        description: "New dataset: classification or regression"
        type: string
        default: ""
      metric:
        description: "New dataset: accuracy, rmse or mae"
        type: string
        default: ""
      id_column:
        description: "New dataset: ID column (optional)"
        type: string
        default: ""
      max_steps:
        description: single_agent step budget (optional, default 15)
        type: string
        default: ""
      time_limit_minutes:
        description: Stop the run after this many minutes
        type: string
        default: "30"

permissions:
  contents: write          # to commit results

concurrency:
  group: agent-runs        # one run at a time, so result commits never clash
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AUTONOMOUSDS_TRIGGER: actions                     # marks runs as gha-...
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALLOW_PAID: "false"
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}   # only for Kaggle tasks
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      SYSTEM: ${{ inputs.system }}
      TASK_NAME: ${{ inputs.task || inputs.name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          pip install -e .
          if [ "$SYSTEM" = direct ]; then pip install -e ".[direct]"; fi
          if [ "$SYSTEM" = automl ]; then
            pip install "torch==2.13.0" --index-url https://download.pytorch.org/whl/cpu
            pip install -e ".[automl]"
          fi

      - name: Build sandbox image
        if: inputs.system == 'single_agent' || inputs.system == 'pipeline'
        run: docker build -t autonomousds-sandbox:latest -f docker/sandbox.Dockerfile .

      - name: Restore earlier runs
        run: python scripts/archive_runs.py restore

      - name: Add new dataset
        if: inputs.task == ''
        env:              # inputs passed as env vars, never pasted into the script
          NAME: ${{ inputs.name }}
          URL: ${{ inputs.url }}
          TARGET: ${{ inputs.target }}
          TASK_TYPE: ${{ inputs.task_type }}
          METRIC: ${{ inputs.metric }}
          ID_COLUMN: ${{ inputs.id_column }}
        run: |
          args=(--name "$NAME" --url "$URL" --target "$TARGET" --task-type "$TASK_TYPE" --metric "$METRIC")
          if [ -n "$ID_COLUMN" ]; then args+=(--id-column "$ID_COLUMN"); fi
          python scripts/add_task.py "${args[@]}"

      - name: Run
        env:
          MAX_STEPS: ${{ inputs.max_steps }}
          LIMIT: ${{ inputs.time_limit_minutes }}
        run: |
          case "$SYSTEM" in
            direct) timeout "${LIMIT}m" python scripts/run_direct.py --task "$TASK_NAME" ;;
            automl) timeout "${LIMIT}m" python scripts/run_automl.py --task "$TASK_NAME" --time-limit 300 ;;
            *)
              args=(--system "$SYSTEM" --task "$TASK_NAME" --time-limit-minutes "$LIMIT")
              if [ -n "$MAX_STEPS" ]; then args+=(--max-steps "$MAX_STEPS"); fi
              python scripts/run_job.py "${args[@]}"
              ;;
          esac

      - name: Save run and refresh report
        if: always()
        run: |
          python scripts/archive_runs.py export
          python scripts/build_report.py

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add benchmark/ README.md
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "Add $SYSTEM run on $TASK_NAME"
          git pull --rebase
          git push